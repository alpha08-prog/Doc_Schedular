name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type-check, Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      # Dummy values so `prisma generate` (postinstall) and `next build` succeed.
      # No real database is contacted during type-check/lint/test/build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/docscheduler?schema=public"
      AUTH_SECRET: "ci-secret-that-is-at-least-32-characters-long"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
