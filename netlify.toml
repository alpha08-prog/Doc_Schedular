[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Next.js on Netlify requires the official plugin for SSR/API routes.
# Install it with: npm install @netlify/plugin-nextjs
# Then uncomment the block below:
#
# [[plugins]]
#   package = "@netlify/plugin-nextjs"

# NOTE: The SPA catch-all redirect is NOT used here because this is a
# server-rendered Next.js app, not a static SPA. Netlify Next.js plugin
# handles routing automatically once installed.

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
